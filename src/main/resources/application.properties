spring.application.name=webhook-delivery

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhook_delivery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Explicitly disable DDL auto as per requirements
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.enabled=true

# Server
server.port=8080

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.example.webhook=DEBUG
