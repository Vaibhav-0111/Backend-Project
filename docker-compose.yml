version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: webhook-db
    environment:
      POSTGRES_DB: ${DB_NAME:-webhook_delivery}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-webhook_delivery}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: webhook-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-webhook_delivery}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
